<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1017" />
      <stop offset="50%" stop-color="#15212d" />
      <stop offset="100%" stop-color="#080d13" />
    </linearGradient>

    <!-- Synology Photos Amber / Gold Gradients -->
    <linearGradient id="synoAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="warmTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.75" />
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />

  <!-- Ambient Glow Circles -->
  <circle cx="1020" cy="360" r="350" fill="url(#glowGrad)" filter="url(#glow)" />
  <circle cx="200" cy="620" r="220" fill="#f59e0b" opacity="0.08" filter="url(#glow)" />

  <!-- Subtle Geometric Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="360" x2="1280" y2="360" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="600" x2="1280" y2="600" />
    <line x1="160" y1="0" x2="160" y2="720" />
    <line x1="320" y1="0" x2="320" y2="720" />
    <line x1="480" y1="0" x2="480" y2="720" />
    <line x1="640" y1="0" x2="640" y2="720" />
    <line x1="800" y1="0" x2="800" y2="720" />
    <line x1="960" y1="0" x2="960" y2="720" />
    <line x1="1120" y1="0" x2="1120" y2="720" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(100, 160)">
    <!-- Platform Badge -->
    <g transform="translate(0, 0)">
      <rect width="210" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
      <circle cx="20" cy="19" r="6" fill="#f59e0b" />
      <text x="36" y="24" font-family="Ubuntu, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1">UBUNTU TOUCH</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="90" font-family="Ubuntu, system-ui, sans-serif" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Photos
    </text>
    <text x="0" y="145" font-family="Ubuntu, system-ui, sans-serif" font-size="34" font-weight="600" fill="#fbbf24">
      for NAS Synology
    </text>

    <!-- Subtitle / Value Prop -->
    <text x="0" y="205" font-family="Ubuntu, system-ui, sans-serif" font-size="18" font-weight="400" fill="#e2e8f0" fill-opacity="0.85">
      Browse, share and automatically back up your photos to Synology Photos.
    </text>
    <text x="0" y="235" font-family="Ubuntu, system-ui, sans-serif" font-size="18" font-weight="400" fill="#e2e8f0" fill-opacity="0.85">
      Full DSM WebAPI integration with timeline, albums and video streaming.
    </text>

    <!-- Features Pill Badges -->
    <g transform="translate(0, 290)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="180" height="42" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
      <text x="18" y="26" font-family="Ubuntu, system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">📸 Auto Backup</text>
      
      <!-- Pill 2 -->
      <rect x="195" y="0" width="175" height="42" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
      <text x="215" y="26" font-family="Ubuntu, system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">🗂️ Albums &amp; Tags</text>

      <!-- Pill 3 -->
      <rect x="385" y="0" width="180" height="42" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
      <text x="405" y="26" font-family="Ubuntu, system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">⚡ Synology DSM</text>
    </g>
  </g>

  <!-- Right Graphic Illustration: Synology Photos Cards -->
  <g transform="translate(790, 130)" filter="url(#dropShadow)">

    <!-- Background Photo Card 1 (Rotated right) -->
    <g transform="translate(60, 40) rotate(7)">
      <rect width="320" height="390" rx="28" fill="#18232f" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" />
      
      <!-- Landscape Miniature inside card -->
      <g transform="translate(20, 20)">
        <rect width="280" height="230" rx="18" fill="url(#warmTeal)" />
        <!-- Golden Sun & Mountain Horizon -->
        <circle cx="80" cy="70" r="35" fill="url(#goldGrad)" />
        <path d="M 0 230 L 90 120 L 180 230 Z" fill="#0f172a" />
        <path d="M 120 230 L 210 90 L 280 230 Z" fill="#1e293b" />
      </g>
      
      <text x="30" y="285" font-family="Ubuntu, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Personal Space</text>
      <text x="30" y="310" font-family="Ubuntu, system-ui, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">2,450 photos • Timeline View</text>
      <text x="30" y="345" font-family="Ubuntu, system-ui, sans-serif" font-size="13" font-weight="600" fill="#fbbf24">✓ Synology Photos API</text>
    </g>

    <!-- Foreground Photo Card 2 (Rotated left) -->
    <g transform="translate(0, 70) rotate(-4)">
      <rect width="330" height="400" rx="28" fill="#0f1722" stroke="url(#synoAmber)" stroke-width="2" />
      
      <!-- Main Photo Thumbnail -->
      <g transform="translate(20, 20)">
        <rect width="290" height="240" rx="18" fill="url(#synoAmber)" />
        <!-- Landscape Sunset Scene -->
        <circle cx="210" cy="80" r="40" fill="#ffffff" fill-opacity="0.9" />
        <path d="M 0 240 L 100 130 L 200 240 Z" fill="#78350f" />
        <path d="M 140 240 L 220 110 L 290 240 Z" fill="#92400e" />
        
        <!-- Live Backup Progress Badge overlay -->
        <g transform="translate(15, 15)">
          <rect width="135" height="32" rx="16" fill="#0a1017" fill-opacity="0.85" />
          <circle cx="16" cy="16" r="6" fill="#fbbf24" />
          <text x="30" y="21" font-family="Ubuntu, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Photo Backup</text>
        </g>
      </g>

      <!-- Details in Card -->
      <text x="30" y="295" font-family="Ubuntu, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Mobile Upload Sync</text>
      
      <!-- Progress Bar -->
      <g transform="translate(30, 315)">
        <rect width="270" height="6" rx="3" fill="#ffffff" fill-opacity="0.12" />
        <rect width="230" height="6" rx="3" fill="url(#goldGrad)" />
      </g>

      <text x="30" y="345" font-family="Ubuntu, system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">SYNO.Foto.Upload • H.264 Video</text>
      <text x="30" y="370" font-family="Ubuntu, system-ui, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">DSM 7.x Compatible</text>
    </g>

    <!-- Floating Camera Lens Aperture Badge -->
    <g transform="translate(280, 240)">
      <circle cx="38" cy="38" r="38" fill="#0a1017" stroke="url(#synoAmber)" stroke-width="2.5" filter="url(#dropShadow)" />
      <!-- Camera Aperture Blades Vector -->
      <circle cx="38" cy="38" r="16" fill="none" stroke="#fbbf24" stroke-width="3" />
      <path d="M 38 22 L 48 32 L 44 44 L 32 44 L 28 32 Z" fill="#fbbf24" fill-opacity="0.3" stroke="#fbbf24" stroke-width="1.5" />
    </g>
  </g>

</svg>
